# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo, then Render Dashboard -> New -> Blueprint -> pick repo.
# Only OPENAI_API (marked sync:false) needs to be typed in by hand.

services:
  - type: web
    name: recipe-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # 0.1 CPU / 512 MB — the reason this image has no torch
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- LLM (OpenAI-compatible) ---
      - key: OPENAI_API          # your key; never commit it
        sync: false
      - key: OPENAI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      # Model must support tool calling on your account. Measured end-to-end
      # on this corpus (free tier, same API key — only this value changes):
      #   openai/gpt-oss-20b                  1-13s   correct, terminates   <- default
      #   nvidia/nemotron-3-super-120b-a12b  17-58s   reasoning model, erratic
      #   z-ai/glm-5.3-flash                   64s
      #   z-ai/glm-5.3                        221s
      #   google/gemma-4-31b-it               722s    effectively unusable
      # Everything else returned "Function ... Not found for account".
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b

      # --- retrieval ---
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: ANSWER_MODE
        value: grounded          # set to "creative" to allow improvised recipes
      - key: MAX_ITERATIONS
        value: "4"               # each round is another model call; 3 was too few and looped out
      - key: ALLOWED_ORIGINS
        value: "*"               # tighten to your frontend origin once it exists
